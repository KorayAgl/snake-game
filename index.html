<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: radial-gradient(ellipse at center, #4a2814 0%, #2a1408 100%);
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
    }
    .layout {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
    }
    .game { display: flex; flex-direction: column; align-items: center; }

    /* ── HUD ───────────────────────────────────────────── */
    #hud {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 4px 4px 10px;
    }
    #score {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #9c27b0;
    }
    #score.bump { animation: bump 0.3s ease-out; }
    @keyframes bump { 40% { transform: scale(1.25); color: #ffeb3b; } }
    #best { font-size: 14px; color: #d7b8e0; flex: 1; }
    .icon-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      border-radius: 8px;
      width: 36px; height: 32px;
      font-size: 16px;
      cursor: pointer;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.16); }

    /* ── Spielfeld ─────────────────────────────────────── */
    .stage {
      position: relative;
      width: min(440px, calc(100vw - 32px));
      aspect-ratio: 1;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 6px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      touch-action: none;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(12,4,18,0.62);
      backdrop-filter: blur(2px);
      border-radius: 6px;
      gap: 12px;
      padding: 16px;
      text-align: center;
    }
    #overlay h2 { margin: 0; font-size: 28px; }
    #sub { font-size: 18px; min-height: 0; }
    #sub:empty, #status:empty { display: none; }
    #status { font-size: 14px; color: #ffe082; }
    #nameInput {
      width: 220px;
      max-width: 100%;
      padding: 9px 12px;
      font-size: 16px;
      text-align: center;
      color: #fff;
      background: rgba(0,0,0,0.35);
      border: 2px solid #6a1b9a;
      border-radius: 8px;
      outline: none;
    }
    #nameInput:focus { border-color: #ce93d8; box-shadow: 0 0 0 3px rgba(206,147,216,0.25); }
    #nameInput.shake { animation: shake 0.35s; border-color: #ff5252; }
    @keyframes shake {
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .diff-row { display: flex; gap: 8px; }
    .diff-btn {
      padding: 7px 16px;
      font-size: 14px;
      border: 2px solid #555;
      background: transparent;
      color: #ccc;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .diff-btn.active { border-color: #9c27b0; background: #4a148c; color: #fff; }
    .diff-btn:hover:not(.active) { border-color: #9c27b0; color: #fff; }
    #startBtn {
      padding: 10px 32px;
      font-size: 16px;
      background: #7b1fa2;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(156,39,176,0.5);
      transition: background 0.2s;
    }
    #startBtn:hover { background: #4a148c; }
    .hint { font-size: 12px; color: #bfaec6; }
    #countdown {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 100px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 30px #ce93d8, 0 0 60px #9c27b0;
      background: rgba(0,0,0,0.35);
      border-radius: 6px;
      pointer-events: none;
    }
    #countdown.pop { animation: pop 0.7s ease-out; }
    @keyframes pop {
      0%   { transform: scale(1.8); opacity: 0; }
      30%  { transform: scale(1);   opacity: 1; }
      100% { transform: scale(0.8); opacity: 0.6; }
    }

    /* ── Bestenliste ───────────────────────────────────── */
    .panel {
      width: 280px;
      margin-top: 46px;
      padding: 16px;
      background: rgba(20,10,4,0.55);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    }
    .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .panel-head h3 { margin: 0; font-size: 18px; }
    .badge { font-size: 12px; color: #aaa; display: flex; align-items: center; gap: 6px; }
    .badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .badge.live { color: #69f0ae; }
    .badge.live::before { animation: pulse 1.6s infinite; }
    @keyframes pulse { 50% { opacity: 0.25; } }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tabs button {
      flex: 1;
      padding: 6px 0;
      font-size: 13px;
      color: #ccc;
      background: transparent;
      border: 1px solid #555;
      border-radius: 6px;
      cursor: pointer;
    }
    .tabs button.active { color: #fff; background: #4a148c; border-color: #9c27b0; }
    .board {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 120px;
    }
    .board li {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      font-size: 15px;
    }
    .board li.me { background: rgba(156,39,176,0.35); box-shadow: inset 0 0 0 1px rgba(206,147,216,0.5); }
    .board li.flash { animation: flash 1.4s ease-out; }
    @keyframes flash { from { background: rgba(255,235,59,0.55); } }
    .board li.empty { display: block; text-align: center; color: #aaa; font-size: 14px; background: none; }
    .board .rank { color: #d7b8e0; }
    .board .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .board .pts { font-weight: 700; font-variant-numeric: tabular-nums; }
    .note { font-size: 12px; color: #a99; margin: 12px 0 0; }
    .note:empty { display: none; }

    @media (max-width: 780px) {
      .panel { width: min(440px, calc(100vw - 32px)); margin-top: 0; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="game">
      <div id="hud">
        <span id="score">Score: 0</span>
        <span id="best"></span>
        <button id="muteBtn" class="icon-btn" title="Ton an/aus (M)">🔊</button>
      </div>
      <div class="stage" id="stage">
        <canvas id="canvas"></canvas>
        <div id="overlay">
          <h2 id="msg">🐍 Snake</h2>
          <div id="sub"></div>
          <div id="status"></div>
          <input id="nameInput" maxlength="16" placeholder="Dein Name" autocomplete="off" spellcheck="false">
          <div class="diff-row">
            <button class="diff-btn" data-diff="easy">Einfach</button>
            <button class="diff-btn" data-diff="normal">Normal</button>
            <button class="diff-btn" data-diff="hard">Schwer</button>
          </div>
          <button id="startBtn">Starten</button>
          <div class="hint">Pfeiltasten / WASD / Wischen · Enter = Start · M = Ton</div>
        </div>
        <div id="countdown"></div>
      </div>
    </div>

    <aside class="panel">
      <div class="panel-head">
        <h3>🏆 Bestenliste</h3>
        <span id="liveBadge" class="badge">Lädt…</span>
      </div>
      <div class="tabs" id="tabs">
        <button data-diff="easy">Einfach</button>
        <button data-diff="normal">Normal</button>
        <button data-diff="hard">Schwer</button>
      </div>
      <ol id="boardList" class="board"></ol>
      <p id="boardNote" class="note"></p>
    </aside>
  </div>

  <script>
    // ════════════════════════════════════════════════════════════════
    //  Online-Bestenliste (Firebase Firestore) – Anleitung: README.md
    //  Solange hier null steht, wird nur lokal im Browser gespeichert.
    // ════════════════════════════════════════════════════════════════
    const FIREBASE_CONFIG = null;
    // Beispiel:
    // const FIREBASE_CONFIG = {
    //   apiKey: "AIza...",
    //   authDomain: "mein-snake.firebaseapp.com",
    //   projectId: "mein-snake",
    //   appId: "1:1234567890:web:abcdef",
    // };
    const FIREBASE_VERSION = '10.12.2';

    const canvas    = document.getElementById('canvas');
    const ctx       = canvas.getContext('2d');
    const overlay   = document.getElementById('overlay');
    const scoreEl   = document.getElementById('score');
    const bestEl    = document.getElementById('best');
    const msgEl     = document.getElementById('msg');
    const subEl     = document.getElementById('sub');
    const statusEl  = document.getElementById('status');
    const cdEl      = document.getElementById('countdown');
    const nameInput = document.getElementById('nameInput');
    const startBtn  = document.getElementById('startBtn');
    const muteBtn   = document.getElementById('muteBtn');
    const listEl    = document.getElementById('boardList');
    const noteEl    = document.getElementById('boardNote');
    const badgeEl   = document.getElementById('liveBadge');

    const TAU    = Math.PI * 2;
    const BORDER = 20;
    const SIZE   = 20;
    const COLS   = 20;
    const ROWS   = 20;
    const FW     = COLS * SIZE;
    const FH     = ROWS * SIZE;
    const W      = FW + BORDER * 2;
    const H      = FH + BORDER * 2;
    const DPR    = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = W * DPR;
    canvas.height = H * DPR;

    const DIFFS = {
      easy:   { label: 'Einfach', speed: 200 },
      normal: { label: 'Normal',  speed: 130 },
      hard:   { label: 'Schwer',  speed: 80  },
    };

    // localStorage kann blockiert sein (privater Modus) → nie abstürzen
    const store = {
      get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch { return def; } },
      set(k, v)   { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    };

    let diff  = DIFFS[store.get('snake.diff', 'normal')] ? store.get('snake.diff', 'normal') : 'normal';
    let SPEED = DIFFS[diff].speed; // ms pro Feld

    // ── Hilfsfunktionen ───────────────────────────────────────────────
    function mulberry32(seed) {
      return () => {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    const easeOut     = u => 1 - Math.pow(1 - u, 3);
    const easeOutBack = u => 1 + 2.7 * Math.pow(u - 1, 3) + 1.7 * Math.pow(u - 1, 2);
    const cellCenter  = p => ({ x: BORDER + p.x * SIZE + SIZE / 2, y: BORDER + p.y * SIZE + SIZE / 2 });
    const mid         = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

    function makeLayer(w, h, draw) {
      const oc = document.createElement('canvas');
      oc.width = w * DPR; oc.height = h * DPR;
      const c = oc.getContext('2d');
      c.scale(DPR, DPR);
      draw(c);
      return oc;
    }

    // ── Offscreen: Erde (einmalig) ────────────────────────────────────
    const earthOC = makeLayer(W, H, c => {
      c.fillStyle = '#5d3a1a';
      c.fillRect(0, 0, W, H);
      const r = mulberry32(42);
      for (let i = 0; i < 700; i++) {
        const x = r() * W, y = r() * H;
        if (x >= BORDER && x <= BORDER+FW && y >= BORDER && y <= BORDER+FH) continue;
        const s = 0.5 + r() * 0.7;
        c.fillStyle = `rgba(${Math.floor(90*s)},${Math.floor(45*s)},${Math.floor(12*s)},0.75)`;
        c.beginPath(); c.arc(x, y, 0.8 + r()*2.2, 0, TAU); c.fill();
      }
      const r2 = mulberry32(77);
      for (let i = 0; i < 22; i++) {
        let x, y;
        do { x = r2()*W; y = r2()*H; }
        while (x >= BORDER-6 && x <= BORDER+FW+6 && y >= BORDER-6 && y <= BORDER+FH+6);
        c.fillStyle = 'rgba(110,80,50,0.55)';
        c.beginPath(); c.ellipse(x, y, 3+r2()*5, 2+r2()*3, r2()*Math.PI, 0, TAU); c.fill();
      }
    });

    // ── Offscreen: Rasen (einmalig) ───────────────────────────────────
    const grassOC = makeLayer(FW, FH, c => {
      for (let x = 0; x < COLS; x++) {
        for (let y = 0; y < ROWS; y++) {
          const dark = (x + y) % 2 === 0;
          c.fillStyle = dark ? '#3a7d1e' : '#4a8f26';
          c.fillRect(x*SIZE, y*SIZE, SIZE, SIZE);
          c.strokeStyle = dark ? 'rgba(0,0,0,0.09)' : 'rgba(255,255,255,0.045)';
          c.lineWidth = 0.5;
          for (let g = 3; g < SIZE; g += 5) {
            c.beginPath();
            c.moveTo(x*SIZE+g, y*SIZE+SIZE);
            c.lineTo(x*SIZE+g-1, y*SIZE+SIZE-4);
            c.stroke();
          }
        }
      }
      // Schatten an der oberen/linken Kante → Rasen liegt etwas tiefer als die Erde
      let g = c.createLinearGradient(0, 0, 0, 8);
      g.addColorStop(0, 'rgba(0,0,0,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g; c.fillRect(0, 0, FW, 8);
      g = c.createLinearGradient(0, 0, 8, 0);
      g.addColorStop(0, 'rgba(0,0,0,0.3)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g; c.fillRect(0, 0, 8, FH);
      c.strokeStyle = '#2d6015'; c.lineWidth = 2;
      c.strokeRect(0, 0, FW, FH);
    });

    // ── Sound (Web Audio, komplett synthetisch) ───────────────────────
    const sfx = (() => {
      let ac = null, master = null, noise = null;
      let muted = store.get('snake.muted', false);

      function ensure() {
        if (!ac) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ac = new AC();
          master = ac.createGain();
          master.gain.value = 0.55;
          master.connect(ac.destination);
          noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
          const d = noise.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        if (ac.state === 'suspended') ac.resume();
        return ac;
      }
      function env(g, t, peak, attack, decay) {
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(peak, t + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
      }
      function noiseHit(t, freq, q, peak, decay, type = 'bandpass') {
        const src = ac.createBufferSource(); src.buffer = noise;
        const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
        const g = ac.createGain(); env(g, t, peak, 0.003, decay);
        src.connect(f); f.connect(g); g.connect(master);
        src.start(t, Math.random() * 0.8);
        src.stop(t + decay + 0.05);
      }
      function tone(t, type, f0, f1, peak, dur) {
        const o = ac.createOscillator(); o.type = type;
        o.frequency.setValueAtTime(f0, t);
        if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
        const g = ac.createGain(); env(g, t, peak, 0.005, dur);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + dur + 0.05);
      }

      return {
        unlock() { ensure(); },
        get muted() { return muted; },
        toggle() { muted = !muted; store.set('snake.muted', muted); return muted; },

        // Apfelbiss: "Knack" durch die Schale + kurzes Knirschen
        bite() {
          if (muted || !ensure()) return;
          const t = ac.currentTime;
          noiseHit(t, 2600, 0.9, 0.9, 0.05);
          tone(t, 'triangle', 380, 120, 0.3, 0.07);
          for (let i = 1; i <= 3; i++) {
            noiseHit(t + 0.03 + i*0.028 + Math.random()*0.012, 1500 + Math.random()*2200, 1.4, 0.45 / i, 0.035);
          }
        },

        // Tod: dumpfer Aufprall + absteigendes "Wuuu"
        death() {
          if (muted || !ensure()) return;
          const t = ac.currentTime;
          tone(t, 'sine', 160, 40, 0.9, 0.3);
          noiseHit(t, 500, 0.7, 0.6, 0.18, 'lowpass');
          const o = ac.createOscillator(); o.type = 'sawtooth';
          o.frequency.setValueAtTime(520, t + 0.05);
          o.frequency.exponentialRampToValueAtTime(80, t + 0.75);
          const lfo = ac.createOscillator(); lfo.frequency.value = 10;
          const lg = ac.createGain(); lg.gain.value = 18;
          lfo.connect(lg); lg.connect(o.frequency);
          const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
          const g = ac.createGain();
          g.gain.setValueAtTime(0.0001, t + 0.05);
          g.gain.exponentialRampToValueAtTime(0.14, t + 0.08);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
          o.connect(lp); lp.connect(g); g.connect(master);
          o.start(t + 0.05); lfo.start(t + 0.05);
          o.stop(t + 0.85); lfo.stop(t + 0.85);
        },

        beep(high) {
          if (muted || !ensure()) return;
          const f = high ? 988 : 659;
          tone(ac.currentTime, 'sine', f, f, 0.25, high ? 0.25 : 0.12);
        },
      };
    })();

    // ── Spielzustand ──────────────────────────────────────────────────
    // state: menu → countdown → playing → dying → over
    let state = 'menu';
    let snake, prevSnake, dir, dirQueue, food, score;
    let lastTick   = 0;
    let lastFrame  = performance.now();
    let foodBorn   = 0;     // ab hier ploppt der Apfel auf
    let pendingEat = null;  // gefressener Apfel, bis der Kopf ihn erreicht hat
    let bulges     = [];    // Schluck-Beulen, wandern den Körper entlang
    let chompAt    = -1e9;
    let death      = null;
    let shake      = { at: -1e9, power: 0 };
    let lastHead   = { x: 0, y: 0 };
    const particles = [];

    function resetGame() {
      snake      = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      prevSnake  = snake.map(s => ({ ...s }));
      dir        = { x: 1, y: 0 };
      dirQueue   = [];
      score      = 0;
      pendingEat = null;
      bulges     = [];
      death      = null;
      particles.length = 0;
      placeFood(performance.now());
    }

    function placeFood(bornAt) {
      const free = [];
      for (let x = 0; x < COLS; x++)
        for (let y = 0; y < ROWS; y++)
          if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
      food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
      foodBorn = bornAt;
    }

    // ein Feld weiter; false bei Game Over
    function tick(now) {
      if (pendingEat) triggerEat(now);
      if (dirQueue.length) dir = dirQueue.shift();

      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      const ate  = !!food && head.x === food.x && head.y === food.y;
      // Der Schwanz rückt im selben Schritt weg – außer die Schlange wächst
      const body = ate ? snake : snake.slice(0, -1);
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
          body.some(s => s.x === head.x && s.y === head.y)) {
        die(now);
        return false;
      }

      // prevSnake = Positionen vor dem Schritt (für die Interpolation)
      prevSnake = snake.map(s => ({ ...s }));
      snake.unshift(head);

      if (ate) {
        // Wachsen: Schwanz bleibt stehen → prevSnake bekommt den gleichen Punkt nochmal
        prevSnake.push({ ...prevSnake[prevSnake.length - 1] });
        score++;
        pendingEat = { ...food };
        placeFood(Infinity); // neuer Apfel erscheint erst nach dem Biss
      } else {
        snake.pop();
      }
      return true;
    }

    // ── Partikel ──────────────────────────────────────────────────────
    function spawn(p) {
      particles.push(Object.assign(
        { vx: 0, vy: 0, z: 0, vz: 0, g: 0, drag: 2.5, life: 0, max: 0.6, size: 2, rot: 0, vr: 0, color: '#fff', kind: 'dot' },
        p));
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life += dt;
        if (p.life >= p.max) { particles.splice(i, 1); continue; }
        const f = Math.exp(-p.drag * dt);
        p.vx *= f; p.vy *= f;
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.g) {
          // Teilchen fliegen hoch und fallen zurück auf den Rasen
          p.vz -= p.g * dt;
          p.z  += p.vz * dt;
          if (p.z < 0) { p.z = 0; p.vz *= -0.35; p.vx *= 0.6; p.vy *= 0.6; }
        }
        p.rot += p.vr * dt;
      }
    }

    function drawParticles() {
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.beginPath();
      for (const p of particles) {
        if (!p.g || p.z < 0.5) continue;
        const s = p.size * 0.9;
        ctx.moveTo(p.x + 1 + s, p.y + 1.5);
        ctx.ellipse(p.x + 1, p.y + 1.5, s, s * 0.55, 0, 0, TAU);
      }
      ctx.fill();

      for (const p of particles) {
        const u = p.life / p.max;
        const x = p.x, y = p.y - p.z;
        ctx.globalAlpha = 1 - u * u;
        switch (p.kind) {
          case 'dot':
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(x, y, p.size * (1 - 0.4*u), 0, TAU); ctx.fill();
            break;
          case 'chunk':
            ctx.save();
            ctx.translate(x, y); ctx.rotate(p.rot);
            ctx.fillStyle = p.color; ctx.fillRect(-p.size, -p.size*0.7, p.size*2, p.size*1.4);
            ctx.fillStyle = p.edge;  ctx.fillRect(-p.size, -p.size*0.7, p.size*2, p.size*0.45);
            ctx.restore();
            break;
          case 'spark':
            ctx.strokeStyle = p.color; ctx.lineWidth = p.size; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - p.vx*0.04, y - p.vy*0.04); ctx.stroke();
            break;
          case 'ring':
            ctx.strokeStyle = p.color; ctx.lineWidth = 2.5 * (1 - u) + 0.3;
            ctx.beginPath(); ctx.arc(x, y, p.size + p.grow * easeOut(u), 0, TAU); ctx.stroke();
            break;
          case 'text': {
            const ty = y - 22 * easeOut(u);
            ctx.font = 'bold 15px Segoe UI, sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(40,0,60,0.8)';
            ctx.strokeText(p.text, x, ty);
            ctx.fillStyle = p.color; ctx.fillText(p.text, x, ty);
            break;
          }
        }
      }
      ctx.globalAlpha = 1;
    }

    // ── Fressen ───────────────────────────────────────────────────────
    function triggerEat(now) {
      const c = cellCenter(pendingEat);
      pendingEat = null;
      foodBorn = now + 80;
      chompAt  = now;
      bulges.push({ at: now });
      sfx.bite();

      scoreEl.textContent = 'Score: ' + score;
      scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');

      const juice = ['#ff5252', '#e53935', '#ff8a80', '#c62828'];
      for (let i = 0; i < 14; i++) {
        const a = Math.random() * TAU, s = 40 + Math.random() * 90;
        spawn({ x: c.x, y: c.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, z: 4, vz: 40 + Math.random()*60, g: 260,
                drag: 1.5, max: 0.5 + Math.random()*0.35, size: 1.2 + Math.random()*1.6,
                color: juice[i % juice.length] });
      }
      for (let i = 0; i < 4; i++) {
        const a = Math.random() * TAU, s = 30 + Math.random() * 50;
        spawn({ kind: 'chunk', x: c.x, y: c.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, z: 5, vz: 70 + Math.random()*40, g: 300,
                drag: 1.2, max: 0.7, size: 1.6 + Math.random()*1.2, vr: (Math.random()-0.5)*20,
                color: '#fff4cc', edge: '#d32f2f' });
      }
      spawn({ kind: 'ring', x: c.x, y: c.y, size: 6, grow: 16, max: 0.35, color: 'rgba(255,255,255,0.85)' });
      spawn({ kind: 'text', x: c.x, y: c.y - 8, max: 0.8, text: '+1', color: '#fff' });
    }

    // ── Tod ───────────────────────────────────────────────────────────
    function die(now) {
      state = 'dying';
      prevSnake = snake.map(s => ({ ...s }));
      const h = cellCenter(snake[0]);
      death = { at: now, dir: { ...dir } };
      shake = { at: now, power: 7 };
      sfx.death();

      // Aufprallpunkt: vor dem Kopf
      const ix = h.x + dir.x * 9, iy = h.y + dir.y * 9;
      spawn({ kind: 'ring', x: ix, y: iy, size: 4, grow: 30, max: 0.45, color: 'rgba(255,82,82,0.9)' });
      const scales = ['#7b1fa2', '#9c27b0', '#ce93d8', '#4a148c'];
      for (let i = 0; i < 18; i++) {
        const a = Math.random() * TAU, s = 50 + Math.random() * 100;
        spawn({ x: ix, y: iy, vx: Math.cos(a)*s, vy: Math.sin(a)*s, z: 6, vz: 50 + Math.random()*80, g: 280,
                drag: 1.6, max: 0.6 + Math.random()*0.4, size: 1.3 + Math.random()*1.7,
                color: scales[i % scales.length] });
      }
      for (let i = 0; i < 10; i++) {
        const a = Math.random() * TAU, s = 120 + Math.random() * 120;
        spawn({ kind: 'spark', x: ix, y: iy, vx: Math.cos(a)*s, vy: Math.sin(a)*s, drag: 5, max: 0.35,
                size: 1.4, color: i % 2 ? '#fff59d' : '#ffffff' });
      }
    }

    function shakeOffset(now) {
      const k = (now - shake.at) / 450;
      if (k >= 1) return { x: 0, y: 0 };
      const p = shake.power * (1 - k) * (1 - k);
      return { x: (Math.random()*2 - 1) * p, y: (Math.random()*2 - 1) * p };
    }

    function starPath(x, y, r, rot) {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const rr = i % 2 ? r * 0.45 : r;
        const a  = rot + i * Math.PI / 5 - Math.PI / 2;
        ctx.lineTo(x + Math.cos(a)*rr, y + Math.sin(a)*rr);
      }
      ctx.closePath();
    }

    function drawDeathFx(now) {
      const k = (now - death.at) / 1000;
      if (k < 0.25) return;
      // Sterne kreisen über dem benommenen Kopf
      ctx.globalAlpha = Math.min(1, (k - 0.25) * 4);
      for (let i = 0; i < 3; i++) {
        const th = now * 0.006 + i * TAU / 3;
        starPath(lastHead.x + Math.cos(th)*12, lastHead.y - 7 + Math.sin(th)*5, 3.4, now*0.004 + i);
        ctx.fillStyle = '#ffeb3b'; ctx.fill();
        ctx.strokeStyle = '#f57f17'; ctx.lineWidth = 0.8; ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // ── Apfel ─────────────────────────────────────────────────────────
    function drawApple(cell, now, scale) {
      const c = cellCenter(cell);
      const z = 3 + Math.sin(now * 0.004 + cell.x) * 1.2; // schwebt leicht
      const r = 7.5 * scale;
      if (r < 0.3) return;

      // Schatten: je höher der Apfel, desto kleiner/heller
      ctx.fillStyle = `rgba(0,0,0,${0.34 - z*0.02})`;
      ctx.beginPath(); ctx.ellipse(c.x + 2, c.y + 5, r*(1.05 - z*0.03), r*0.5, 0, 0, TAU); ctx.fill();

      const x = c.x, y = c.y - z;
      const g = ctx.createRadialGradient(x - r*0.4, y - r*0.45, r*0.1, x, y, r*1.1);
      g.addColorStop(0, '#ff8a80'); g.addColorStop(0.35, '#e53935');
      g.addColorStop(0.85, '#9b0f0f'); g.addColorStop(1, '#6d0a0a');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();

      // Mulde + Stiel + Blatt
      ctx.fillStyle = 'rgba(80,0,0,0.45)';
      ctx.beginPath(); ctx.ellipse(x + r*0.05, y - r*0.5, r*0.28, r*0.16, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#4e342e'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x + r*0.05, y - r*0.5);
      ctx.quadraticCurveTo(x + r*0.15, y - r*1.0, x + r*0.4, y - r*1.15); ctx.stroke();
      const lg = ctx.createLinearGradient(x + r*0.2, y - r*1.1, x + r*1.0, y - r*0.6);
      lg.addColorStop(0, '#9ccc65'); lg.addColorStop(1, '#33691e');
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.ellipse(x + r*0.62, y - r*0.88, r*0.48, r*0.22, 0.5, 0, TAU); ctx.fill();

      // Glanzlicht
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.ellipse(x - r*0.42, y - r*0.2, r*0.22, r*0.32, 0.4, 0, TAU); ctx.fill();
    }

    // ── Schlange ──────────────────────────────────────────────────────
    const BODY_R = 7.2;

    // Mittellinie der Schlange: Kopf → Schwanz, Ecken abgerundet, alle ~1.5px ein Punkt.
    // p.d = Abstand zum Kopf; das Muster hängt an p.d und wandert so mit dem Körper.
    function buildSpine(t, now) {
      const n = snake.length;
      const lerp = (a, b) => ({ x: a.x + (b.x - a.x)*t, y: a.y + (b.y - a.y)*t });
      const cells = [lerp(prevSnake[0], snake[0])];
      for (let i = 1; i < n; i++) cells.push(snake[i]);
      if (n > 1) cells.push(lerp(prevSnake[n-1], snake[n-1]));
      const P = cells.map(cellCenter);

      const pts = [];
      const add = (x, y) => {
        const last = pts[pts.length - 1];
        if (!last) { pts.push({ x, y, d: 0 }); return; }
        const dd = Math.hypot(x - last.x, y - last.y);
        if (dd > 0.01) pts.push({ x, y, d: last.d + dd });
      };
      const line = (a, b) => {
        const steps = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 1.5));
        for (let s = 1; s <= steps; s++) add(a.x + (b.x - a.x)*s/steps, a.y + (b.y - a.y)*s/steps);
      };
      const quad = (a, c, b) => {
        for (let s = 1; s <= 12; s++) {
          const u = s / 12, v = 1 - u;
          add(v*v*a.x + 2*v*u*c.x + u*u*b.x, v*v*a.y + 2*v*u*c.y + u*u*b.y);
        }
      };
      add(P[0].x, P[0].y);
      let cur = P[0];
      for (let k = 1; k < P.length - 1; k++) {
        const m1 = mid(P[k-1], P[k]), m2 = mid(P[k], P[k+1]);
        line(cur, m1); quad(m1, P[k], m2); cur = m2;
      }
      if (P.length > 1) line(cur, P[P.length - 1]);

      const L = pts[pts.length - 1].d;
      const TAPER = SIZE * 2.2;
      const alive = state === 'playing' || state === 'menu' || state === 'countdown';
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
        p.ang = Math.atan2(a.y - b.y, a.x - b.x) || Math.atan2(dir.y, dir.x);

        // Dicke: zum Schwanz hin spitz, Beulen von geschluckten Äpfeln
        let r = BODY_R;
        const tail = L - p.d;
        if (tail < TAPER) r *= 0.3 + 0.7 * Math.pow(tail / TAPER, 0.65);
        for (const bl of bulges) {
          const bd = bulgePos(bl, now);
          r += 3.2 * Math.exp(-((p.d - bd) ** 2) / 50);
        }
        p.r = r;

        // leichtes Schlängeln quer zur Laufrichtung
        if (alive) {
          const w = Math.sin(p.d * 0.16 - now * 0.009) * 1.1 * Math.min(1, p.d / 24) * Math.min(1, tail / 10);
          p.x += -Math.sin(p.ang) * w;
          p.y +=  Math.cos(p.ang) * w;
        }
      }
      bulges = bulges.filter(bl => bulgePos(bl, now) < L + 10);
      return { pts, L };
    }

    // Beule wandert schneller als die Schlange nach hinten
    function bulgePos(bl, now) { return 4 + (now - bl.at) / SPEED * SIZE * 1.5; }

    function addCircles(pts, scale, ox, oy) {
      for (const p of pts) {
        const r = p.r * scale, x = p.x + ox * p.r, y = p.y + oy * p.r;
        ctx.moveTo(x + r, y);
        ctx.arc(x, y, r, 0, TAU);
      }
    }
    function fillCircles(pts, scale, ox, oy, color) {
      ctx.fillStyle = color;
      ctx.beginPath(); addCircles(pts, scale, ox, oy); ctx.fill();
    }

    function headPose(pts, now) {
      const h = pts[0];
      let ang;
      if (death) ang = Math.atan2(death.dir.y, death.dir.x);
      else {
        const ref = pts.find(p => p.d >= 7);
        ang = ref ? Math.atan2(h.y - ref.y, h.x - ref.x) : Math.atan2(dir.y, dir.x);
      }
      let x = h.x, y = h.y, sx = 1, sy = 1;
      const ck = (now - chompAt) / 200;
      if (ck >= 0 && ck < 1) { const s = Math.sin(ck * Math.PI); sx += 0.12*s; sy += 0.2*s; }
      if (death) {
        // "Bonk": Kopf stößt vor, wird gestaucht und federt zurück
        const k = (now - death.at) / 300;
        if (k < 1) {
          const b = Math.sin(k * Math.PI);
          x += death.dir.x * 5 * b; y += death.dir.y * 5 * b;
          sx -= 0.22 * b; sy += 0.15 * b;
        }
      }
      return { x, y, ang, sx, sy, rx: 9.6 * sx, ry: 8.2 * sy };
    }

    function drawTongue(hd, now) {
      if (death) return;
      const ph = now % 2300, dur = 320;
      if (ph > dur) return;
      const ext = Math.sin(ph / dur * Math.PI);
      const len = 9 * ext;
      if (len < 1) return;
      const base = hd.rx - 2, tip = base + len, wob = Math.sin(now * 0.06) * 0.8;
      ctx.save();
      ctx.translate(hd.x, hd.y); ctx.rotate(hd.ang);
      ctx.strokeStyle = '#e91e63'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(base, 0); ctx.quadraticCurveTo(base + len*0.5, wob, tip, 0);
      ctx.moveTo(tip, 0); ctx.lineTo(tip + 3*ext, -2.2*ext);
      ctx.moveTo(tip, 0); ctx.lineTo(tip + 3*ext,  2.2*ext);
      ctx.stroke();
      ctx.restore();
    }

    function blinkAmount(now) {
      const ph = now % 3400;
      return ph < 140 ? Math.sin(ph / 140 * Math.PI) : 0;
    }

    function drawHead(hd, now) {
      const { x, y, ang, rx, ry } = hd;
      // Grundfarbe leicht nach oben-links versetzt → Licht kommt von oben links
      ctx.fillStyle = '#8e24aa';
      ctx.beginPath(); ctx.ellipse(x - 0.7, y - 0.7, rx*0.88, ry*0.86, ang, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(225,190,231,0.55)';
      ctx.beginPath(); ctx.ellipse(x - 2.6, y - 2.6, rx*0.5, ry*0.42, ang, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.ellipse(x - 3.8, y - 3.8, 1.9, 1.3, ang, 0, TAU); ctx.fill();

      const k = death ? (now - death.at) / 1000 : 0;
      if (death) {
        // roter Aufprall-Blitz, danach bleibt der Kopf leicht gerötet
        const a = 0.18 + 0.5 * Math.max(0, 1 - k) * (0.5 + 0.5*Math.cos(k * 24));
        ctx.fillStyle = `rgba(255,40,40,${a})`;
        ctx.beginPath(); ctx.ellipse(x, y, rx, ry, ang, 0, TAU); ctx.fill();
      }

      const cos = Math.cos(ang), sin = Math.sin(ang);
      const toWorld = (lx, ly) => ({ x: x + cos*lx*hd.sx - sin*ly*hd.sy, y: y + sin*lx*hd.sx + cos*ly*hd.sy });

      // Nasenlöcher
      ctx.fillStyle = 'rgba(30,0,40,0.7)';
      for (const side of [-1, 1]) {
        const n = toWorld(7.4, side * 2.1);
        ctx.beginPath(); ctx.arc(n.x, n.y, 0.9, 0, TAU); ctx.fill();
      }

      // Augen
      const bk = death ? 0 : blinkAmount(now);
      for (const side of [-1, 1]) {
        const e = toWorld(2.2, side * 4.7);
        ctx.fillStyle = '#3a0a52';
        ctx.beginPath(); ctx.arc(e.x + 0.5, e.y + 0.6, 3.5, 0, TAU); ctx.fill();

        if (death) {
          ctx.fillStyle = '#e1bee7';
          ctx.beginPath(); ctx.arc(e.x, e.y, 3, 0, TAU); ctx.fill();
          ctx.strokeStyle = '#1a0026'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
          ctx.beginPath();
          for (const a of [ang + Math.PI/4, ang - Math.PI/4]) {
            ctx.moveTo(e.x - Math.cos(a)*2.3, e.y - Math.sin(a)*2.3);
            ctx.lineTo(e.x + Math.cos(a)*2.3, e.y + Math.sin(a)*2.3);
          }
          ctx.stroke();
          continue;
        }

        const open = 1 - 0.9 * bk;
        const ig = ctx.createRadialGradient(e.x - 1, e.y - 1, 0.3, e.x, e.y, 3);
        ig.addColorStop(0, '#fff8c4'); ig.addColorStop(0.5, '#ffd54f'); ig.addColorStop(1, '#f57f17');
        ctx.fillStyle = ig;
        ctx.beginPath(); ctx.ellipse(e.x, e.y, 3 * open, 3, ang, 0, TAU); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.ellipse(e.x + cos*0.5, e.y + sin*0.5, 0.85 * open, 2.3, ang, 0, TAU); ctx.fill();
        if (open > 0.5) {
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(e.x - 1.1, e.y - 1.2, 0.9, 0, TAU); ctx.fill();
        }
      }
    }

    function drawPattern(pts, L) {
      let j = 0;
      for (let k = 0, d = 15; d < L - 5; k++, d += 9) {
        while (j < pts.length - 1 && pts[j].d < d) j++;
        const p = pts[j], r = p.r;
        const cx = p.x - r*0.08, cy = p.y - r*0.08;
        const c = Math.cos(p.ang), s = Math.sin(p.ang);
        if (k % 2 === 0) {
          // dunkle Raute in Laufrichtung
          const a = r * 0.62, b = r * 0.5;
          ctx.fillStyle = 'rgba(38,4,62,0.55)';
          ctx.beginPath();
          ctx.moveTo(cx + c*a, cy + s*a);
          ctx.lineTo(cx - s*b, cy + c*b);
          ctx.lineTo(cx - c*a, cy - s*a);
          ctx.lineTo(cx + s*b, cy - c*b);
          ctx.closePath(); ctx.fill();
        } else {
          ctx.fillStyle = 'rgba(243,229,245,0.35)';
          ctx.beginPath(); ctx.ellipse(cx, cy, r*0.22, r*0.16, p.ang, 0, TAU); ctx.fill();
        }
      }
    }

    function drawSnake(now, t) {
      const { pts, L } = buildSpine(t, now);
      const hd = headPose(pts, now);
      lastHead = hd;

      drawTongue(hd, now);

      // 1) dunkle Kontur + Schlagschatten (Körper und Kopf in einem Pfad)
      ctx.save();
      ctx.shadowColor   = 'rgba(0,0,0,0.45)';
      ctx.shadowBlur    = 7 * DPR;
      ctx.shadowOffsetX = 3 * DPR;
      ctx.shadowOffsetY = 4 * DPR;
      ctx.fillStyle = '#2b0842';
      ctx.beginPath();
      addCircles(pts, 1, 0, 0);
      ctx.moveTo(hd.x + Math.cos(hd.ang)*hd.rx, hd.y + Math.sin(hd.ang)*hd.rx);
      ctx.ellipse(hd.x, hd.y, hd.rx, hd.ry, hd.ang, 0, TAU);
      ctx.fill();
      ctx.restore();

      // 2) Grundfarbe, 3) Muster, 4) Glanzstreifen → wirkt wie eine runde Röhre
      fillCircles(pts, 0.84, -0.1, -0.1, '#7b1fa2');
      drawPattern(pts, L);
      fillCircles(pts, 0.46, -0.3, -0.32, 'rgba(206,147,216,0.55)');
      fillCircles(pts, 0.2, -0.42, -0.45, 'rgba(255,255,255,0.55)');

      drawHead(hd, now);
    }

    // ── Rendern & Game Loop ───────────────────────────────────────────
    function render(now, t) {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.drawImage(earthOC, 0, 0, W, H);
      const sk = shakeOffset(now);
      ctx.translate(sk.x, sk.y);
      ctx.drawImage(grassOC, BORDER, BORDER, FW, FH);

      if (food && now >= foodBorn) {
        const k = (now - foodBorn) / 320;
        drawApple(food, now, k >= 1 ? 1 : easeOutBack(k));
      }
      if (pendingEat) drawApple(pendingEat, now, 1);
      drawSnake(now, t);
      drawParticles();
      if (death) drawDeathFx(now);
    }

    function frame(now) {
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;

      if (state === 'playing') {
        if (now - lastTick > SPEED * 4) lastTick = now - SPEED; // Tab war im Hintergrund
        while (state === 'playing' && now - lastTick >= SPEED) {
          lastTick += SPEED;
          tick(now);
        }
      }
      const t = state === 'playing' ? Math.min((now - lastTick) / SPEED, 1) : 1;

      // Biss-Effekte erst, wenn der Kopf den Apfel sichtbar erreicht
      if (pendingEat && (t >= 0.55 || state !== 'playing')) triggerEat(now);
      if (state === 'dying' && now - death.at > 1100) {
        state = 'over';
        showGameOver();
      }

      updateParticles(dt);
      render(now, t);
      requestAnimationFrame(frame);
    }

    // ── Bestenliste (Firestore oder lokal) ────────────────────────────
    const Board = (() => {
      const LOCAL_KEY = 'snake.localScores';
      let fs = null, db = null, unsub = null, localEmit = null;
      const coll     = d => 'scores_' + d;
      const localAll = () => store.get(LOCAL_KEY, {});
      const localTop = d => Object.values(localAll()[d] || {}).sort((a, b) => b.score - a.score).slice(0, 10);

      return {
        online: false,

        async init() {
          if (!FIREBASE_CONFIG) return false;
          try {
            const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
            const [app, firestore] = await Promise.all([
              import(base + 'firebase-app.js'),
              import(base + 'firebase-firestore.js'),
            ]);
            fs = firestore;
            db = fs.getFirestore(app.initializeApp(FIREBASE_CONFIG));
            this.online = true;
          } catch (err) {
            console.warn('Firebase konnte nicht geladen werden – nutze lokale Bestenliste.', err);
          }
          return this.online;
        },

        // ruft onRows bei jeder Änderung mit den Top 10 auf (live)
        subscribe(d, onRows, onError) {
          if (unsub) unsub();
          if (this.online) {
            const q = fs.query(fs.collection(db, coll(d)), fs.orderBy('score', 'desc'), fs.limit(10));
            unsub = fs.onSnapshot(q, snap => onRows(snap.docs.map(doc => doc.data())), onError);
          } else {
            localEmit = () => onRows(localTop(d));
            localEmit();
            unsub = () => { localEmit = null; };
          }
        },

        async best(name, d) {
          const key = name.toLowerCase();
          if (this.online) {
            const snap = await fs.getDoc(fs.doc(db, coll(d), key));
            return snap.exists() ? snap.data().score : 0;
          }
          return localAll()[d]?.[key]?.score ?? 0;
        },

        // speichert nur, wenn besser als der bisherige Rekord; gibt den alten Rekord zurück
        async submit(name, d, score) {
          const key = name.toLowerCase();
          if (this.online) {
            const ref = fs.doc(db, coll(d), key);
            return fs.runTransaction(db, async tx => {
              const snap = await tx.get(ref);
              const prev = snap.exists() ? snap.data().score : 0;
              if (score > prev) tx.set(ref, { name, score, ts: fs.serverTimestamp() });
              return prev;
            });
          }
          const all = localAll();
          const table = all[d] = all[d] || {};
          const prev = table[key]?.score ?? 0;
          if (score > prev) {
            table[key] = { name, score };
            store.set(LOCAL_KEY, all);
            if (localEmit) localEmit();
          }
          return prev;
        },
      };
    })();

    let playerName = store.get('snake.name', '');
    let boardDiff  = diff;
    let boardReady = false; // erst nach Board.init() abonnieren
    let lastSeen   = null; // Scores der letzten Anzeige → neue/verbesserte Einträge aufblinken lassen

    function renderBoard(rows) {
      const me = playerName.toLowerCase();
      listEl.replaceChildren();
      if (!rows.length) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.textContent = 'Noch keine Einträge – sei der Erste!';
        listEl.append(li);
      }
      rows.forEach((row, i) => {
        const key = String(row.name).toLowerCase();
        const li = document.createElement('li');
        if (key === me) li.classList.add('me');
        if (lastSeen && lastSeen.get(key) !== row.score) li.classList.add('flash');
        const rank = document.createElement('span'); rank.className = 'rank';
        rank.textContent = ['🥇', '🥈', '🥉'][i] || (i + 1) + '.';
        const name = document.createElement('span'); name.className = 'name';
        name.textContent = row.name;
        const pts = document.createElement('span'); pts.className = 'pts';
        pts.textContent = row.score;
        li.append(rank, name, pts);
        listEl.append(li);
      });
      lastSeen = new Map(rows.map(r => [String(r.name).toLowerCase(), r.score]));
    }

    function watchBoard(d) {
      boardDiff = d;
      lastSeen = null;
      document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.diff === d));
      Board.subscribe(d, rows => { if (d === boardDiff) renderBoard(rows); }, err => {
        console.error(err);
        noteEl.textContent = '⚠️ Bestenliste nicht erreichbar (' + (err.code || err.message) + ')';
      });
    }

    async function refreshBest() {
      const name = playerName, d = diff;
      if (!name) { bestEl.textContent = ''; return; }
      try {
        const b = await Board.best(name, d);
        if (name === playerName && d === diff) bestEl.textContent = `Rekord (${DIFFS[d].label}): ${b}`;
      } catch (err) { console.warn(err); }
    }

    // ── UI ────────────────────────────────────────────────────────────
    const NAME_CHARS = /[^A-Za-z0-9ÄÖÜäöüß .-]/g;
    const cleanName  = s => s.replace(NAME_CHARS, '').replace(/\s+/g, ' ').trim().slice(0, 16);

    nameInput.value = playerName;
    nameInput.addEventListener('input', () => {
      const c = nameInput.value.replace(NAME_CHARS, '');
      if (c !== nameInput.value) nameInput.value = c;
    });

    function setDiff(d) {
      diff  = d;
      SPEED = DIFFS[d].speed;
      store.set('snake.diff', d);
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.toggle('active', b.dataset.diff === d));
      if (boardReady) { watchBoard(d); refreshBest(); }
    }
    document.querySelectorAll('.diff-btn').forEach(b => b.addEventListener('click', () => setDiff(b.dataset.diff)));
    document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => watchBoard(b.dataset.diff)));

    function updateMuteBtn() { muteBtn.textContent = sfx.muted ? '🔇' : '🔊'; }
    function toggleMute() { sfx.toggle(); updateMuteBtn(); }
    muteBtn.addEventListener('click', () => { toggleMute(); muteBtn.blur(); });
    updateMuteBtn();

    startBtn.addEventListener('click', startGame);

    function startGame() {
      if (state !== 'menu' && state !== 'over') return;
      const name = cleanName(nameInput.value);
      if (!/[A-Za-z0-9ÄÖÜäöüß]/.test(name)) {
        nameInput.classList.remove('shake'); void nameInput.offsetWidth; nameInput.classList.add('shake');
        nameInput.focus();
        return;
      }
      nameInput.value = name;
      if (name !== playerName) {
        playerName = name;
        store.set('snake.name', name);
        if (boardReady) { refreshBest(); watchBoard(boardDiff); } // eigene Zeile neu markieren
      }
      sfx.unlock();
      nameInput.blur();
      overlay.style.display = 'none';
      resetGame();
      scoreEl.textContent = 'Score: 0';
      state = 'countdown';

      let n = 3;
      cdEl.style.display = 'flex';
      const show = () => {
        cdEl.textContent = n;
        cdEl.classList.remove('pop'); void cdEl.offsetWidth; cdEl.classList.add('pop');
        sfx.beep(false);
      };
      show();
      const iv = setInterval(() => {
        n--;
        if (n > 0) return show();
        clearInterval(iv);
        cdEl.style.display = 'none';
        sfx.beep(true);
        state = 'playing';
        lastTick = performance.now() - SPEED; // erster Schritt sofort
      }, 700);
    }

    async function showGameOver() {
      const name = playerName, d = diff, s = score;
      msgEl.textContent = '💀 Game Over!';
      subEl.textContent = 'Score: ' + s;
      statusEl.textContent = '';
      startBtn.textContent = 'Nochmal';
      overlay.style.display = 'flex';
      if (s <= 0) return;

      statusEl.textContent = 'Speichere…';
      try {
        const prev = await Board.submit(name, d, s);
        statusEl.textContent = s > prev
          ? (prev ? `🎉 Neuer Rekord! (vorher ${prev})` : '🎉 Erster Eintrag in der Bestenliste!')
          : `Dein Rekord (${DIFFS[d].label}): ${prev}`;
        refreshBest();
      } catch (err) {
        console.error(err);
        statusEl.textContent = '⚠️ Score konnte nicht gespeichert werden';
      }
    }

    // ── Steuerung ─────────────────────────────────────────────────────
    const KEYS = {
      ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
      w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
      W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0],
    };

    // bis zu 2 Richtungswechsel vormerken → schnelle Doppel-Kurven gehen nicht verloren
    function queueDir(x, y) {
      const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
      if ((x === last.x && y === last.y) || (x === -last.x && y === -last.y)) return;
      if (dirQueue.length < 2) dirQueue.push({ x, y });
    }

    document.addEventListener('keydown', e => {
      const idle = state === 'menu' || state === 'over';
      if (e.key === 'Enter' && idle) { e.preventDefault(); startGame(); return; }
      if (e.target === nameInput) return;
      if ((e.key === 'r' || e.key === 'R') && idle) { startGame(); return; }
      if (e.key === 'm' || e.key === 'M') { toggleMute(); return; }
      const d = KEYS[e.key];
      if (!d) return;
      e.preventDefault();
      if (state === 'playing' || state === 'countdown') queueDir(d[0], d[1]);
    });

    // Wischen auf dem Handy
    let touch = null;
    canvas.addEventListener('touchstart', e => {
      const t = e.touches[0]; touch = { x: t.clientX, y: t.clientY };
    }, { passive: true });
    canvas.addEventListener('touchmove', e => {
      if (!touch) return;
      const t = e.touches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      if (state === 'playing' || state === 'countdown') {
        if (Math.abs(dx) > Math.abs(dy)) queueDir(Math.sign(dx), 0);
        else queueDir(0, Math.sign(dy));
      }
      touch = { x: t.clientX, y: t.clientY };
    }, { passive: true });
    canvas.addEventListener('touchend', () => { touch = null; });

    // ── Start ─────────────────────────────────────────────────────────
    resetGame();
    setDiff(diff);
    if (!playerName) nameInput.focus();
    requestAnimationFrame(frame);

    (async () => {
      await Board.init();
      boardReady = true;
      badgeEl.textContent = Board.online ? 'Live' : 'Nur lokal';
      badgeEl.classList.toggle('live', Board.online);
      if (!Board.online) noteEl.textContent = 'Highscores werden nur in diesem Browser gespeichert – für eine gemeinsame Online-Bestenliste siehe README.';
      watchBoard(boardDiff);
      refreshBest();
    })();
  </script>
</body>
</html>
